[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tenderready.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = [
    "tenderready", "core", "accounts", "rules", "checks", "llm",
    "documents", "tenders", "versions", "alerts", "insight", "access",
]
